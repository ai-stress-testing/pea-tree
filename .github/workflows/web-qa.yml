name: web QA

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # GitHub runners have no pre-installed browser; fetch Chromium here.
      # (Locally, playwright.config.ts uses the environment's pinned binary.)
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
